<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Topology Builder</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

#toolbar{
    height:60px;
    background:#2c3e50;
    display:flex;
    align-items:center;
    padding:10px;
    gap:10px;
}

button{
    padding:8px 15px;
    border:none;
    background:#3498db;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

#modeLabel{
    color:white;
    font-weight:bold;
    margin-left:20px;
}

#workspace{
    position:relative;
    width:100vw;
    height:calc(100vh - 60px);
    background:#ecf0f1;
    overflow:hidden;
}

svg{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}

.device{
    position:absolute;
    width:90px;
    height:70px;
    background:white;
    border:2px solid #34495e;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:move;
    user-select:none;
    z-index:5;
}

.device.selected{
    border:3px solid red;
}

.icon{
    font-size:28px;
}

.label{
    font-size:12px;
    margin-top:5px;
}
</style>
</head>
<body>

<div id="toolbar">
    <button onclick="addDevice('router')">Add Router</button>
    <button onclick="addDevice('switch')">Add Switch</button>
    <button onclick="addDevice('pc')">Add PC</button>
    <button onclick="startConnect()">Connect Devices</button>

    <span id="modeLabel">Mode: Move Devices</span>
</div>

<div id="workspace">
    <svg id="cables"></svg>
</div>

<script>
const workspace = document.getElementById('workspace');
const svg = document.getElementById('cables');
const modeLabel = document.getElementById('modeLabel');

let nodeCounter = 1;
let connectMode = false;
let firstNode = null;

const connections = [];

function addDevice(type){

    const node = document.createElement('div');
    node.className = 'device';

    let icon = '';
    let name = '';

    if(type === 'router'){
        icon = '📡';
        name = 'Router';
    }
    else if(type === 'switch'){
        icon = '🔀';
        name = 'Switch';
    }
    else{
        icon = '💻';
        name = 'PC';
    }

    node.innerHTML = `
        <div class="icon">${icon}</div>
        <div class="label">${name} ${nodeCounter}</div>
    `;

    node.id = 'node' + nodeCounter++;
    node.style.left = '100px';
    node.style.top = '100px';

    workspace.appendChild(node);

    makeDraggable(node);

    node.addEventListener('click', e=>{
        e.stopPropagation();

        if(connectMode){
            selectNode(node);
        }
    });
}

function startConnect(){
    connectMode = true;
    firstNode = null;
    clearSelections();
    modeLabel.textContent = 'Mode: Select 2 Devices to Connect';
}

function selectNode(node){

    if(!firstNode){
        firstNode = node;
        node.classList.add('selected');
        return;
    }

    if(firstNode === node){
        return;
    }

    createCable(firstNode,node);

    firstNode.classList.remove('selected');
    firstNode = null;

    connectMode = false;
    modeLabel.textContent = 'Mode: Move Devices';
}

function createCable(nodeA,nodeB){

    const line = document.createElementNS(
        'http://www.w3.org/2000/svg',
        'line'
    );

    line.setAttribute('stroke','#2c3e50');
    line.setAttribute('stroke-width','3');

    svg.appendChild(line);

    connections.push({
        nodeA,
        nodeB,
        line
    });

    updateLines();
}

function updateLines(){

    connections.forEach(conn=>{

        const a = getCenter(conn.nodeA);
        const b = getCenter(conn.nodeB);

        conn.line.setAttribute('x1',a.x);
        conn.line.setAttribute('y1',a.y);
        conn.line.setAttribute('x2',b.x);
        conn.line.setAttribute('y2',b.y);
    });
}

function getCenter(node){

    const rect = node.getBoundingClientRect();
    const parent = workspace.getBoundingClientRect();

    return{
        x: rect.left - parent.left + rect.width/2,
        y: rect.top - parent.top + rect.height/2
    };
}

function clearSelections(){
    document.querySelectorAll('.device')
        .forEach(d=>d.classList.remove('selected'));
}

function makeDraggable(element){

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    element.addEventListener('mousedown',e=>{

        if(connectMode) return;

        dragging = true;

        offsetX = e.clientX - element.offsetLeft;
        offsetY = e.clientY - element.offsetTop;
    });

    document.addEventListener('mousemove',e=>{

        if(!dragging) return;

        element.style.left =
            (e.clientX - offsetX) + 'px';

        element.style.top =
            (e.clientY - offsetY) + 'px';

        updateLines();
    });

    document.addEventListener('mouseup',()=>{
        dragging = false;
    });
}

window.addEventListener('resize', updateLines);
</script>

</body>
</html>
