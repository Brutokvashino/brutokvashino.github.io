
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      font-family: monospace;
      white-space: pre;
    }
    .feedback {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Daily Practice</h2>
    <br><a href="https://www.subnetting.net/Subnetting.aspx?mode=practice">Subnetting.net</a><br>
    <button id="getconfiglinks" onclick="getconfiglinks()">Practice Configs</button>
<span id="configlinkgot"></span>
  </div>

  <script>
function getRndInteger(min, max) {
  return Math.floor(Math.random() * (max - min + 1) ) + min;
}
        function configlinks() {
          var txt = getRndInteger(1,2);
          if (txt == 1) {return "Scenic";}
          else if (txt == 2) {return "Historic";}
        }
    	function getconfiglinks(){
    document.getElementById("configlinkgot").innerHTML = configlinks();
}

    
  </script>
</body>
</html>
