<!DOCTYPE html>
<html>
<body>
     
<div Id="gameWindow">
</div>
<script>
const gameWindow = document.getElementById("gameWindow");
function getRndInteger(min, max) {
  return Math.floor(Math.random() * (max - min + 1) ) + min;
}

function showStage1() {
    gameWindow.innerHTML = `
   <button id="getrarity">Biome</button>  
        <span id="raritycollection"></span>
        <button id="wizard">Next</button>
    `;
    document.getElementById("getrarity").onclick = getrarity;
    document.getElementById("wizard").onclick = showStage2;
}

function getrarity() {
    document.getElementById("raritycollection").innerHTML = rarity();
}
    function showStage2() {
    gameWindow.innerHTML = `
        <button id="forest">Forage</button><span id="gotforage"></span>
        <button id="castle">Monster</button><span id="gotmonster"></span>
        <button id="explore">Explore</button><span id="gotexplore"></span>
        <button id="back">Back</button>
    `;
    document.getElementById("back").onclick = showStage1;
}

        function rarity() {
          var txt = getRndInteger(1,145);
          if (txt == 1) {
            return "grassland";
          }
          else if (txt == 2){
            return "hardwood forest";
          }
          else if (txt == 3){
            return "desert";
          }
          else if (txt == 4){
            return "savannah";
          }
          else if (txt == 5){
            return "mountain";
          }
          else if (txt == 6){
            return "ocean";
          }
          else if (txt == 7){
            return "arctic";
          }
          else if (txt == 8){
            return "canyon";
          }
          else if (txt == 9){
            return "jungle";
          }
          else if (txt == 10){
            return "fir tree forest";
          }
          else if (txt == 11){
            return "swamp";
          }
          else if (txt == 12){
            return "beach";
          }
          else if (txt == 13){
            return "lake";
          }
          else if (txt >= 14 && txt <= 18){
            return "island";
          }
          else if (txt >= 19 && txt <= 144){
            return "ocean";
          }
          else if (txt == 145){
            return "mushroom";
          }
        }
function forage() { var txt = getRndInteger(1,145); if (txt == 1) {return "beehive";}
          else if (txt == 2){return "oak wood";}
          else if (txt == 3){return "seeds";}
          }
     function monster() { var txt = getRndInteger(1,145); if (txt == 1) {return "zombie meat";}
          else if (txt == 2){return "you died";}
          else if (txt == 3){return "nightray skin";}
          }
function explore() { var txt = getRndInteger(1,145); if (txt == 1) {return "flowers";}
          else if (txt == 2){return "village";}
          else if (txt == 3){return "cave";}
          }
  function getrarity(){
    document.getElementById("raritycollection").innerHTML = rarity();
}
function getforage(){
    document.getElementById("gotforage").innerHTML = forage();
}
function getmonster(){
    document.getElementById("gotmonster").innerHTML = monster();
}
function getexplore(){
    document.getElementById("gotexplore").innerHTML = explore();
}
showStage1();

</script>

</body>
</html>
